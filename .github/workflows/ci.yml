name: Test package
on:
  # Branches only: a release pushes main and its tag together, and a tag run tested the same commit a second time.
  # The two runs need 8 macOS jobs, above the 5 that GitHub runs at a time, so main's run waited about 5 minutes.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  # A new Pi release must fail CI the day it ships, before the owner updates Pi.
  schedule:
    - cron: '17 11 * * *'
permissions:
  contents: read
# A new commit on a PR cancels the PR's run in progress. Pushes and the schedule get a group of their own run, so
# no run on main is ever cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Each OS and Node pair runs the whole suite, split over shards: scripts/test-files.mjs packs the unit test files by
  # the seconds in .ci/timings.json, and tests/test-shards.test.mjs checks that the shards of every count cover each
  # file exactly once and that this matrix lists shards 1 to `shards`. Shard 1 also runs the short checks.
  test:
    name: test (${{ matrix.os }}, ${{ matrix.node }}, ${{ matrix.shard }}/${{ matrix.shards }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
        shard: [1, 2, 3, 4]
        # GitHub runs at most 5 macOS jobs at a time on the free plan, so macOS gets 2 shards for each Node.
        exclude:
          - { os: macos-latest, shard: 3 }
          - { os: macos-latest, shard: 4 }
        include:
          - { os: ubuntu-latest, shards: 4 }
          - { os: macos-latest, shards: 2 }
    runs-on: ${{ matrix.os }}
    # A whole macOS run took 8 to 9 minutes and once went past 10 (0.37.0); a shard runs half of it.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      # Pi's jiti transforms and Node's compile cache (scripts/tmp-guard.mjs SHARED_CACHES) live in node_modules/.cache,
      # which npm ci empties: a cold cache costs about 40 s of CPU on each shard. Both key each entry by its source, so
      # an older cache can only miss, never serve a wrong file. main saves it; every branch and PR can read it.
      - uses: actions/cache/restore@v4
        with:
          path: node_modules/.cache
          key: test-transforms-${{ runner.os }}-${{ runner.arch }}-node${{ matrix.node }}-${{ matrix.shard }}of${{ matrix.shards }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: test-transforms-${{ runner.os }}-${{ runner.arch }}-node${{ matrix.node }}-${{ matrix.shard }}of${{ matrix.shards }}-${{ hashFiles('package-lock.json') }}-
      - if: matrix.shard == 1
        run: npm run typecheck
      - name: Run npm test (shard ${{ matrix.shard }} of ${{ matrix.shards }})
        env:
          PI_TEST_SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
          PI_TEST_TIMINGS: test-timings.xml
        run: npm test
      - if: matrix.shard == 1
        run: npm run test:install
      - if: matrix.shard == 1
        run: npm run audit:package
      # The seconds of each test file, for the next .ci/timings.json (CONTRIBUTING.md, periodic upkeep).
      - if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-${{ matrix.os }}-node${{ matrix.node }}-${{ matrix.shard }}of${{ matrix.shards }}
          path: test-timings.xml
          retention-days: 30
          if-no-files-found: ignore
      - if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: node_modules/.cache
          key: test-transforms-${{ runner.os }}-${{ runner.arch }}-node${{ matrix.node }}-${{ matrix.shard }}of${{ matrix.shards }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
  # pi-extras supports only the latest Pi. The job above tests the Pi in package-lock, which is also the minimum in
  # the README and the peer ranges (a test checks it). This one tests the newest Pi that npm serves now.
  pi-versions:
    name: Pi ${{ matrix.pi }} (${{ matrix.shard }}/${{ matrix.shards }})
    strategy:
      fail-fast: false
      matrix:
        pi: [latest]
        shard: [1, 2, 3, 4]
        include:
          - { pi: latest, shards: 4 }
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Typecheck and test with Pi ${{ matrix.pi }}
        env:
          PI_TEST_SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
          PI_VERSION: ${{ matrix.pi }}
        run: npm run test:pi -- "$PI_VERSION" --no-restore
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
