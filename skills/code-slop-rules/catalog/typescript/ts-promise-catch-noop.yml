id: ts-promise-catch-noop
language: typescript
severity: warning
message: A .catch handler that does nothing swallows the rejection.
note: Log the rejection with context, pass it to the caller, or name the expected error.
metadata:
  family: swallowed-error
  precision: high
  overlap: { eslint: [] }
utils:
  noop-handler:
    any:
      - kind: arrow_function
        has:
          field: body
          any:
            - { kind: statement_block, regex: '^\{\s*(//[^\n]*\s*|/\*[\s\S]*?\*/\s*)*(return\s*(undefined|null|void 0)?\s*;?\s*)?\}$' }
            - { kind: undefined }
            - { kind: 'null' }
            - { kind: 'false' }
            - { kind: unary_expression, regex: '^void 0$' }
            - { kind: parenthesized_expression, regex: '^\(\s*\{\s*\}\s*\)$' }
      - kind: function_expression
        has: { field: body, regex: '^\{\s*(//[^\n]*\s*|/\*[\s\S]*?\*/\s*)*\}$' }
      - { kind: identifier, regex: '^(noop|ignore|ignoreError|swallow)$' }
rule:
  kind: call_expression
  any:
    # p.catch(noop) and p?.catch(noop)
    - all:
        - has: { field: function, kind: member_expression, has: { field: property, regex: '^catch$' } }
        - has: { field: arguments, has: { nthChild: 1, matches: noop-handler } }
    # p.then(ok, noop): the second argument is the rejection handler
    - all:
        - has: { field: function, kind: member_expression, has: { field: property, regex: '^then$' } }
        - has: { field: arguments, has: { nthChild: 2, matches: noop-handler } }
