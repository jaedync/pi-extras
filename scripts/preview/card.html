<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
	@font-face { font-family: "JB"; src: url(fonts/JetBrainsMono-Regular.ttf); font-weight: 400; }
	@font-face { font-family: "JB"; src: url(fonts/JetBrainsMono-Bold.ttf); font-weight: 700; }
	@font-face { font-family: "JB"; src: url(fonts/JetBrainsMono-Italic.ttf); font-style: italic; }
	html, body { margin: 0; background: #000; }
	#stage { position: relative; width: 1280px; height: 640px; overflow: hidden; font-family: "JB", monospace;
		font-variant-ligatures: none; -webkit-font-smoothing: antialiased; }
</style>
<script src="frame.js"></script>
<script src="term.js"></script>
<script src="hero.js"></script>
</head>
<body>
<div id="stage"></div>
<script>
	document.fonts.ready.then(async () => {
		await Promise.all(["400 16px JB", "700 16px JB", "italic 16px JB"].map((font) => document.fonts.load(font)));
		window.drawHero(document.getElementById("stage"));
		document.body.dataset.ready = "1";
	});
</script>
</body>
</html>
