id: ts-lint-disable
language: typescript
severity: warning
message: A comment turns off a linter rule.
note: Fix the finding, or keep the disable and give the reason on the same line.
metadata:
  family: checker-off
  precision: high
  overlap: { eslint: ['eslint-comments/no-unlimited-disable'] }
rule:
  kind: comment
  regex: '(eslint-disable|biome-ignore|oxlint-disable|deno-lint-ignore)'
