id: ts-promise-catch-noop
valid:
  - 'p.catch((error) => log(error));'
  - 'p.catch(report);'
  - 'p.then(() => {});'
  - 'p.then((v) => use(v), (error) => report(error));'
  - 'p.then(() => {});'
  - 'p.catch((error) => { log(error); });'
invalid:
  - 'p.catch(() => {});'
  - 'p.catch(() => undefined);'
  - 'p.catch(() => null);'
  - 'p.catch((_error) => {});'
  - 'p.catch(() => { /* gone */ });'
  - 'p.catch(function () {});'
  - 'p.catch(noop);'
  - 'p?.catch(() => {});'
  - 'p.catch((e: Error) => {});'
  - 'p.then(ok, () => {});'
  - 'p.then((v) => use(v), (e) => {});'
  - 'p.catch(() => { return; });'
  - 'p.catch(async (_error: unknown) => undefined);'
  - 'p.catch(() => void 0);'
  - 'p.catch((e) => ({}));'
